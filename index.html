<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#07080c"
    >

    <title>Weatherly</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

<main class="app">

    <div class="weather-card">


        <header class="top">

            <div>

                <p class="label">
                    WEATHERLY
                </p>

                <h1>
                    Weather Dashboard
                </h1>

            </div>


            <div class="status">

                <span></span>

                Online

            </div>

        </header>



        <nav class="navbar">

            <a
                href="index.html"
                class="nav-link active"
            >
                Home
            </a>


            <a
                href="forecast.html"
                class="nav-link"
            >
                Forecast
            </a>


            <a
                href="favorites.html"
                class="nav-link"
            >
                Favorites
            </a>

        </nav>



        <section class="search-section">

            <form
                id="weatherForm"
                class="search-box"
            >

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Cari kota..."
                    autocomplete="off"
                    required
                >


                <button type="submit">
                    Search
                </button>

            </form>

        </section>



        <div class="toolbar">

            <button
                id="locationBtn"
                class="tool-btn"
                type="button"
            >
                📍 Lokasi saya
            </button>


            <button
                id="unitBtn"
                class="tool-btn"
                type="button"
            >
                °C / °F
            </button>

        </div>



        <div
            id="error"
            class="error hidden"
        ></div>



        <section
            id="weather"
            class="weather-content hidden"
        >


            <div class="location">

                <div class="location-icon">
                    📍
                </div>


                <div>

                    <h2 id="city">
                        --
                    </h2>

                    <p id="country">
                        --
                    </p>

                </div>

            </div>



            <div class="main-weather">


                <div class="temperature-area">

                    <div class="temperature">

                        <span id="temperature">
                            --
                        </span>

                        <span id="temperatureUnit">
                            °C
                        </span>

                    </div>


                    <p id="description">
                        --
                    </p>


                    <p class="feels">

                        Terasa seperti

                        <span id="feelsLike">
                            --
                        </span>

                        <span id="feelsLikeUnit">
                            °C
                        </span>

                    </p>

                </div>


                <img
                    id="weatherIcon"
                    src=""
                    alt="Weather"
                >

            </div>



            <div class="details">


                <div class="detail">

                    <span>
                        💧
                    </span>

                    <small>
                        Humidity
                    </small>

                    <strong id="humidity">
                        --%
                    </strong>

                </div>



                <div class="detail">

                    <span>
                        💨
                    </span>

                    <small>
                        Wind
                    </small>

                    <strong id="wind">
                        -- km/h
                    </strong>

                </div>



                <div class="detail">

                    <span>
                        🌡️
                    </span>

                    <small>
                        Pressure
                    </small>

                    <strong id="pressure">
                        -- hPa
                    </strong>

                </div>



                <div class="detail">

                    <span>
                        ☁️
                    </span>

                    <small>
                        Clouds
                    </small>

                    <strong id="clouds">
                        --%
                    </strong>

                </div>

            </div>



            <div class="sun">


                <div>

                    <span>
                        🌅
                    </span>

                    Sunrise

                    <strong id="sunrise">
                        --:--
                    </strong>

                </div>



                <div>

                    <span>
                        🌇
                    </span>

                    Sunset

                    <strong id="sunset">
                        --:--
                    </strong>

                </div>

            </div>



            <div class="favorite-area">

                <button
                    id="favoriteBtn"
                    class="favorite-btn"
                    type="button"
                >
                    ☆ Add to Favorites
                </button>

            </div>


        </section>



        <div
            id="loading"
            class="loading hidden"
        >

            <div class="spinner"></div>

            <p>
                Mengambil data cuaca...
            </p>

        </div>


    </div>

</main>



<script src="./script.js"></script>

</body>

</html>
