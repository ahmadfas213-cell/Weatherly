<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff7df"><title>Weatherly — Home</title><link rel="stylesheet" href="./style.css"></head><body><main class="app"><div class="weather-card"><header class="top"><div><p class="label">WEATHERLY / 01</p><h1>Weather Dashboard</h1></div><div class="status"><span></span> ONLINE</div></header><nav class="navbar"><a href="index.html" class="nav-link active">HOME</a><a href="forecast.html" class="nav-link">FORECAST</a><a href="favorites.html" class="nav-link">FAVORITES</a><a href="insights.html" class="nav-link">INSIGHTS</a></nav><section class="search-section"><form id="weatherForm" class="search-box"><input id="cityInput" placeholder="Cari kota..." autocomplete="off" required><button type="submit">SEARCH</button></form><div id="recentSearches" class="recent"></div></section><div class="toolbar"><button id="locationBtn" class="tool-btn" type="button">📍 LOKASI SAYA</button><button id="unitBtn" class="tool-btn" type="button">°C / °F</button></div><div id="error" class="error hidden"></div><section id="weather" class="weather-content hidden"><div class="location"><div class="location-icon">📍</div><div><h2 id="city">--</h2><p id="country">--</p></div></div><div class="main-weather"><div class="temperature-area"><div class="temperature"><span id="temperature">--</span><span id="temperatureUnit">°C</span></div><p id="description">--</p><p class="feels">Terasa seperti <span id="feelsLike">--</span> <span id="feelsLikeUnit">°C</span></p></div><img id="weatherIcon" src="" alt="Weather"></div><div class="details"><div class="detail"><span>💧</span><small>HUMIDITY</small><strong id="humidity">--%</strong></div><div class="detail"><span>💨</span><small>WIND</small><strong id="wind">-- km/h</strong></div><div class="detail"><span>🌡️</span><small>PRESSURE</small><strong id="pressure">-- hPa</strong></div><div class="detail"><span>☁️</span><small>CLOUDS</small><strong id="clouds">--%</strong></div></div><div class="sun"><div>🌅 SUNRISE <strong id="sunrise">--:--</strong></div><div>🌇 SUNSET <strong id="sunset">--:--</strong></div></div><div class="favorite-area"><button id="favoriteBtn" class="favorite-btn" type="button">☆ ADD TO FAVORITES</button></div></section><div id="loading" class="loading hidden"><div class="spinner"></div><p>MENGAMBIL DATA CUACA...</p></div><footer class="footer">Data cuaca: OpenWeather. Peringatan & informasi Indonesia: BMKG.</footer></div></main><script src="./script.js"></script></body></html>
