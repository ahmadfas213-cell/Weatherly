<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weatherly — Forecast</title><link rel="stylesheet" href="./style.css"></head><body><main class="app"><div class="weather-card"><header class="top"><div><p class="label">WEATHERLY / 02</p><h1>Forecast</h1></div><div class="status"><span></span> LIVE DATA</div></header><nav class="navbar"><a href="index.html" class="nav-link">HOME</a><a href="forecast.html" class="nav-link active">FORECAST</a><a href="favorites.html" class="nav-link">FAVORITES</a><a href="insights.html" class="nav-link">INSIGHTS</a></nav><form id="forecastForm" class="search-box"><input id="forecastCity" placeholder="Kota untuk forecast..." required><button type="submit">GET FORECAST</button></form><div id="forecastError" class="error hidden"></div><div id="forecastLoading" class="loading hidden"><div class="spinner"></div><p>MENGAMBIL FORECAST...</p></div><section id="forecastResult" class="forecast-result hidden"><div class="section-title"><div><span class="badge">5 DAYS / 3 HOURS</span><h2 id="forecastLocation">--</h2></div><p>Min / max temperature</p></div><div id="forecastList" class="forecast-list"></div></section><footer class="footer">Forecast menggunakan OpenWeather 5-day / 3-hour API.</footer></div></main><script src="./forecast.js"></script></body></html>
