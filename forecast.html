<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#07080c"
    >

    <title>Weatherly - Forecast</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

<main class="app">

    <div class="weather-card">


        <header class="top">

            <div>

                <p class="label">
                    WEATHERLY
                </p>

                <h1>
                    Weather Forecast
                </h1>

            </div>


            <div class="status">

                <span></span>

                Online

            </div>

        </header>



        <nav class="navbar">

            <a
                href="index.html"
                class="nav-link"
            >
                Home
            </a>


            <a
                href="forecast.html"
                class="nav-link active"
            >
                Forecast
            </a>


            <a
                href="favorites.html"
                class="nav-link"
            >
                Favorites
            </a>

        </nav>



        <form
            id="forecastForm"
            class="search-box"
        >

            <input
                type="text"
                id="forecastCity"
                placeholder="Cari kota..."
                autocomplete="off"
                required
            >


            <button type="submit">
                Search
            </button>

        </form>



        <div
            id="forecastError"
            class="error hidden"
        ></div>



        <section
            id="forecastLoading"
            class="loading hidden"
        >

            <div class="spinner"></div>

            <p>
                Mengambil prakiraan cuaca...
            </p>

        </section>



        <section
            id="forecastResult"
            class="forecast-result hidden"
        >

            <div class="forecast-header">

                <p class="label">
                    5 DAYS FORECAST
                </p>


                <h2 id="forecastLocation">
                    --
                </h2>

            </div>


            <div
                id="forecastList"
                class="forecast-list"
            ></div>

        </section>


    </div>

</main>


<script src="./forecast.js"></script>

</body>

</html>
